# Build hunt's container images and publish them to GitHub's registry, for
# linux/amd64 and linux/arm64 (each built natively, then joined into one
# multi-platform tag). Tests run first.
#
#   ghcr.io/arabesquelabs/hunt:latest, :sha-…   main's newest build
#   ghcr.io/arabesquelabs/hunt:v0.17.0, :v0.17   a release (a v* git tag: `make publish`)
#   ghcr.io/arabesquelabs/hunt:release           the newest release
#   ghcr.io/arabesquelabs/hunt:demo              main's, with made-up data (the Dockerfile's `demo`)
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/arabesquelabs/hunt

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The web UI (React) is built with Node, then compiled into hunt.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: make ci

  # Each image on each platform, on a runner of its own kind (Rust under
  # emulation takes far too long), pushed by its digest alone.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [hunt, demo]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Layers kept in GitHub's cache, a scope per platform: the
          # dependencies' layer (cargo-chef's) is reused until they change,
          # and the demo reuses the image's.
          cache-from: |
            type=gha,scope=hunt-${{ matrix.platform }}
            type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  # Each image's platforms, joined under its tags.
  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [hunt, demo]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The image: main's as latest (and its sha); a release as its
          # version, its minor version and `release`. The demo: main's only.
          tags: |
            type=raw,value=latest,enable=${{ matrix.target == 'hunt' && github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ matrix.target == 'hunt' && github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}},enable=${{ matrix.target == 'hunt' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ matrix.target == 'hunt' }}
            type=raw,value=release,enable=${{ matrix.target == 'hunt' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=demo,enable=${{ matrix.target == 'demo' && github.ref == 'refs/heads/main' }}
      - if: steps.meta.outputs.tags != ''
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - if: steps.meta.outputs.tags != ''
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
