# Build hunt's container images and publish them to GitHub's registry, for
# linux/amd64 and linux/arm64 (each built natively, then joined into one
# multi-platform tag). Tests run first.
#
# Main's pushes build; a release builds nothing. Its tag (`make publish`)
# only gives the images main already built for its commit their release's
# tags: what's released is what was tested, to the byte.
#
#   ghcr.io/arabesquelabs/hunt:dev, :sha-…            main's newest build
#   ghcr.io/arabesquelabs/hunt:dev-demo, :sha-…-demo  the same, with made-up data (the Dockerfile's `demo`)
#   ghcr.io/arabesquelabs/hunt:v0.17.0                a release (a v* git tag)
#   ghcr.io/arabesquelabs/hunt:v0.17                  that minor version's newest
#   ghcr.io/arabesquelabs/hunt:latest, :release       the newest release
#   ghcr.io/arabesquelabs/hunt:demo                   the newest release, with made-up data
#
# A pre-release tag (v0.18.0-rc.1) gets its own tag only.
name: image

on:
  push:
    branches: [main]
    # The docs reach careerhunt.app from main itself, not from an image.
    paths-ignore: ["docs/**", "**.md"]
    tags: ["v*"]
  # Builds the branch it's run on; only main's are published.
  workflow_dispatch:

# One run per branch or tag at a time. On main, a newer push cancels an
# older run, so :dev is never left on an older build; a release's tags are
# never cancelled.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/arabesquelabs/hunt

jobs:
  test:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The web UI (React) is built with Node, then compiled into hunt.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: make ci

  # Each image on each platform, on a runner of its own kind (Rust under
  # emulation takes far too long), pushed by its digest alone.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [hunt, demo]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Layers kept in GitHub's cache, a scope per platform: the
          # dependencies' layer (cargo-chef's) is reused until they change,
          # and the demo reuses the image's.
          cache-from: |
            type=gha,scope=hunt-${{ matrix.platform }}
            type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  # Each image's platforms, joined under main's tags: :dev and :sha-… for
  # the image, :dev-demo and :sha-…-demo for the demo. The sha tags are
  # what a release's tags are later given from.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [hunt, demo]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        env:
          SUFFIX: ${{ matrix.target == 'demo' && '-demo' || '' }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:dev$SUFFIX" -t "$IMAGE:sha-${GITHUB_SHA::7}$SUFFIX" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:dev$SUFFIX"

  # A release: its commit's images (main built them, and `make publish`
  # checked they're there), given the release's tags. Nothing is rebuilt.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          VERSION: ${{ github.ref_name }}
        run: |
          src="$IMAGE:sha-${GITHUB_SHA::7}"
          for image in "$src" "$src-demo"; do
            docker buildx imagetools inspect "$image" >/dev/null || {
              echo "::error::no $image: main hasn't built $VERSION's commit (${GITHUB_SHA::7})"
              exit 1
            }
          done
          tags=(-t "$IMAGE:$VERSION")
          case "$VERSION" in
            *-*) prerelease=1 ;;
            *) prerelease=; tags+=(-t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest" -t "$IMAGE:release") ;;
          esac
          docker buildx imagetools create "${tags[@]}" "$src"
          [ -n "$prerelease" ] || docker buildx imagetools create -t "$IMAGE:demo" "$src-demo"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
