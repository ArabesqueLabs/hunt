# Build hunt's container image (linux/amd64) and publish it to GitHub's
# registry as ghcr.io/arabesquelabs/hunt: `latest` from main, plus the
# commit's sha, v<version> from Cargo.toml, and any v* tag. Tests run first.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The web UI (React) is built with Node, then compiled into hunt.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: make ci

  image:
    permissions:
      contents: read
      packages: write
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version in Cargo.toml, so main's image is also tagged v<version>
      # (v0.12.0) without a git tag. Until the version changes, each push to
      # main moves that tag to its newer build.
      - id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arabesquelabs/hunt
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layers kept in GitHub's cache between runs, under one name: the
          # dependencies' layer (cargo-chef's, in the Dockerfile) is reused
          # until the dependencies change, releases included.
          cache-from: type=gha,scope=hunt
          cache-to: type=gha,mode=max,scope=hunt
