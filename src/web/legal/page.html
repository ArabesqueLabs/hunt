<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Arabesque Labs">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <script>
    // The chosen theme, before anything draws (the app's index.html does the same).
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <style>{{css}}</style>
</head>
<body class="{{body_class}}">
{{header}}
{{main}}
{{footer}}
</body>
</html>
