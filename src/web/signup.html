<!doctype html>
<!-- Signing up with hunt's own sign-in, while sign-ups are open or invited:
     src/auth.rs fills in the terms of use to agree to (where this hunt has
     some), and what was wrong with the last try. An account asked for waits
     for an admin; an invited one's let in. -->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign up · hunt</title>
  <script>
    // The chosen theme, before anything draws.
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { min-block-size: 100vh; display: grid; place-items: center; margin: 0; padding: 1.5rem; background: var(--al-color-bg); }
    .login { inline-size: min(100%, 24rem); display: grid; gap: 1.5rem; }
    .login-brand { display: inline-flex; align-items: center; gap: 0.6rem; font: 500 1.4rem var(--al-font-display); color: var(--al-color-text); }
    .login-brand img { inline-size: 32px; block-size: 32px; }
    .login form { display: grid; gap: 1rem; }
    .login h1 { margin: 0; font-size: var(--al-text-lg); font-weight: 500; }
    .login p { margin: 0; }
    .login-other { color: var(--al-color-text-muted); }
    .login textarea { inline-size: 100%; resize: vertical; }
  </style>
</head>
<body>
  <main class="login">
    <span class="login-brand"><img src="/logo.svg" alt="">hunt</span>
    <form method="post" action="/signup">
      <h1>Sign up</h1>
      <p class="login-other">Invited? Use the address the invite went to. Otherwise, an admin lets you in.</p>
      <div class="al-field">
        <label class="al-label" for="email">Email</label>
        <input class="al-input" id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="al-field">
        <label class="al-label" for="name">Name</label>
        <input class="al-input" id="name" name="name" autocomplete="name">
      </div>
      <div class="al-field">
        <label class="al-label" for="password">Password</label>
        <input class="al-input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <span class="al-hint">8 characters or more. A few words make a good one.</span>
      </div>
      <div class="al-field">
        <label class="al-label" for="again">The same again</label>
        <input class="al-input" id="again" name="again" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="al-field">
        <label class="al-label" for="reason">What brings you to hunt? <span class="al-label__optional">(optional)</span></label>
        <textarea class="al-input" id="reason" name="reason" rows="2"></textarea>
      </div>
      {{terms}}
      {{error}}
      <button class="al-button al-button--primary" type="submit">Sign up</button>
    </form>
    <p class="login-other">Have an account? <a href="/login">Sign in</a>.</p>
  </main>
</body>
</html>
