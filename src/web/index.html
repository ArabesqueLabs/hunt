<!doctype html>
<!-- The language and direction are set when served, from Settings. -->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Arabesque Labs">
  <title>Hunt | Job Application Tracking System</title>
  <script>
    // The chosen theme, before anything draws.
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <!-- The app: React, built into one script (src/web/vite.config.ts). -->
  <script type="module" src="/app.js"></script>
</head>
<body class="al-shell">
  <script>
    // The sidebar, narrowed to its icons if it was left that way.
    try { if (localStorage.getItem("sidebar") === "mini") document.body.dataset.sidebar = "collapsed"; } catch {}
  </script>
  <!-- The sidebar and the page, drawn by the app: the shell's own children,
       as the design system lays them out. -->
  <aside class="al-sidebar sidebar lattice" id="sidebar"></aside>
  <main id="view" tabindex="-1"></main>
  <!-- footer: legal/footer.html, put in when served -->
  <!-- What floats over them: dialogs, toasts. -->
  <div id="root" style="display: contents"></div>
</body>
</html>
