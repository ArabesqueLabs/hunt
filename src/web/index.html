<!doctype html>
<!-- The language and direction are set when served, from Settings. -->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Arabesque Labs">
  <title>Hunt | Job Application Tracking System</title>
  <script>
    // The chosen theme, before anything draws.
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <!-- The design system's date picker, its charts' tooltips and keys, and
       the sidebar's menu on a phone,
       for hunt's (classic) scripts: run before them, as deferred scripts
       and modules run in order. -->
  <script type="module">
    import { initDatePickers } from "/vendor/arabesque/js/datepicker.js";
    import { initTooltips } from "/vendor/arabesque/js/tooltip.js";
    import { initChartKeys } from "/vendor/arabesque/js/chart.js";
    import { place } from "/vendor/arabesque/js/position.js";
    import { initSidebars } from "/vendor/arabesque/js/sidebar.js";
    window.ArabesqueDates = { initDatePickers };
    window.ArabesquePosition = { place };
    window.ArabesqueCharts = { initChartKeys };
    initTooltips(document);
    initSidebars();
  </script>
  <script src="/i18n.js" defer></script>
  <script src="/i18n-ar.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/application.js" defer></script>
  <script src="/notes.js" defer></script>
  <script src="/cycles.js" defer></script>
  <script src="/prep.js" defer></script>
  <script src="/stats.js" defer></script>
  <script src="/table.js" defer></script>
  <script src="/filters.js" defer></script>
  <script src="/records.js" defer></script>
  <script src="/settings.js" defer></script>
  <script src="/celebrate.js" defer></script>
  <script src="/bulk.js" defer></script>
  <script src="/account.js" defer></script>
  <script src="/takehome.js" defer></script>
</head>
