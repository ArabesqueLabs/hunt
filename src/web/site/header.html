  <header class="al-site-header site-head">
    <div class="al-site-header__bar">
      <a class="al-site-header__lockup legal-brand" href="{{home}}">{{logo}}<span translate="no">hunt</span></a>
      <div class="al-site-header__end">
        <nav class="al-site-header__nav" aria-label="{{t_site}}">
          <ul>
            <li><a href="{{home}}#features">{{t_features}}</a></li>
            <li><a href="{{screenshots}}">{{t_screenshots}}</a></li>
            <li><a href="{{docs}}">{{t_docs}}</a></li>
            <li><a href="{{source}}" translate="no">GitHub</a></li>
          </ul>
        </nav>
        <div class="al-site-header__tools">
          <div class="al-site-header__extras">
            <a class="al-language" href="{{other_href}}" hreflang="{{other_code}}" lang="{{other_code}}">{{other_name}}</a>
          </div>
          <button type="button" class="al-button al-button--icon al-button--quiet" data-theme-toggle data-label-dark="{{t_to_dark}}" data-label-light="{{t_to_light}}" aria-label="{{t_to_dark}}"><svg class="al-icon" aria-hidden="true"><use href="/vendor/arabesque/dist/icons.svg#al-icon-theme"></use></svg></button>
          <button type="button" class="al-button al-button--icon al-button--quiet al-site-header__toggle" data-site-menu-toggle aria-controls="site-menu" aria-expanded="false" aria-label="{{t_menu}}"><svg class="al-icon al-site-header__open" aria-hidden="true"><use href="/vendor/arabesque/dist/icons.svg#al-icon-menu"></use></svg><svg class="al-icon al-site-header__close" aria-hidden="true"><use href="/vendor/arabesque/dist/icons.svg#al-icon-close"></use></svg></button>
        </div>
      </div>
    </div>
    <nav class="al-site-header__menu" id="site-menu" aria-label="{{t_site}}" hidden>
      <ul>
        <li><a href="{{home}}#features">{{t_features}}</a></li>
        <li><a href="{{screenshots}}">{{t_screenshots}}</a></li>
        <li><a href="{{docs}}">{{t_docs}}</a></li>
        <li><a href="{{source}}" translate="no">GitHub</a></li>
      </ul>
      <div class="al-site-header__menu-tools">
        <a class="al-language" href="{{other_href}}" hreflang="{{other_code}}" lang="{{other_code}}">{{other_name}}</a>
      </div>
    </nav>
  </header>
  <script type="module">
    import { initSiteHeaders } from "/vendor/arabesque/js/site-header.js";
    initSiteHeaders();
    // Light or dark, as the app's Settings → Appearance has it: the same
    // choice ("theme" in this browser), kept only while it differs from the
    // system's, as the design system's theme button does.
    const button = document.querySelector("[data-theme-toggle]");
    const dark = matchMedia("(prefers-color-scheme: dark)");
    const current = () => document.documentElement.dataset.theme || (dark.matches ? "dark" : "light");
    const label = () => button.setAttribute("aria-label", current() === "dark" ? button.dataset.labelLight : button.dataset.labelDark);
    button.addEventListener("click", () => {
      const next = current() === "dark" ? "light" : "dark";
      const system = next === (dark.matches ? "dark" : "light");
      try { localStorage.setItem("theme", system ? "auto" : next); } catch { /* storage may be off: it still changes here */ }
      if (system) delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = next;
      label();
    });
    label();
  </script>
